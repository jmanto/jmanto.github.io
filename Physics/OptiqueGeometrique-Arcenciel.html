<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Arc-en-ciel — Pyodide</title>
<link rel="stylesheet" href="assets/style_pyodide.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Simulation Pyodide · Python dans le navigateur</div>
    <h1>Formation de l'arc-en-ciel</h1>
    <div class="sub">Trajectoire de rayons lumineux à travers une goutte d'eau — réfraction, réflexions internes, et dispersion.</div>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Chargement de Pyodide…</span></div>
  </header>

  <div class="panel">
    <div class="controls">
      <div class="ctrl">
        <label>Longueur d'onde (nm) <span class="val" id="wlVal">580</span></label>
        <input type="range" id="wl" min="0" max="40" step="1" value="20">
      </div>
      <div class="ctrl">
        <label>Ordre (réflexions internes) <span class="val" id="NVal">1</span></label>
        <input type="range" id="N" min="1" max="3" step="1" value="1">
      </div>
    </div>
  </div>

  <div class="panel">
    <canvas id="cvGoutte" width="520" height="520"></canvas>
  </div>

  <footer>
    Calcul effectué en Python (NumPy) via Pyodide ; rendu sur &lt;canvas&gt;.
  </footer>
</div>

<script src="constants.js"></script>
<script src="wave_utils.js"></script>
<script src="optics_utils.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.0/full/pyodide.js"></script>
<script>
/* Reprise directe de n_vs_lambda() et trace(). */
const PYTHON_SETUP = `
import numpy as np

def n_vs_lambda(l):
    l = l / 1000
    return 1.428752825641948 - 0.3841328845855708 * l + 0.5282311338593066 * l**2 - 0.2581226944270076 * l**3

def trace(wl, N):
    n = n_vs_lambda(wl)
    longueur = 2
    liste_h = np.arange(0., 1., 0.05)
    rayons = []

    for h in liste_h:
        i = np.arcsin(h)
        r = np.arcsin(h / n)
        x, y = [-2], [h]
        x += [-np.cos(i + nn * (np.pi - 2 * r)) for nn in range(0, N + 2)]
        y += [ np.sin(i + nn * (np.pi - 2 * r)) for nn in range(0, N + 2)]
        theta = i + (N + 1) * (np.pi - 2 * r)
        alpha = np.pi + 2 * (i - r) + N * (np.pi - 2 * r)
        x2, y2 = -np.cos(theta), np.sin(theta)
        x3, y3 = x2 - longueur * np.cos(alpha), y2 + longueur * np.sin(alpha)
        x.append(x3); y.append(y3)
        rayons.append([x, y])

    alpha_goutte = 0.5 * (n - 1)
    return [rayons, float(alpha_goutte)]
`;

let pyodide;
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

const wls = document.getElementById('wl'), Ns = document.getElementById('N');
const wlVal = document.getElementById('wlVal'), NVal = document.getElementById('NVal');
const cvGoutte = document.getElementById('cvGoutte');

const mapWl = v => 380 + v / 40 * 400;

function render() {
  const wl = mapWl(parseFloat(wls.value)), N = parseInt(Ns.value);
  const [rayons, alphaGoutte] = pyodide.runPython(`trace(${wl}, ${N})`).toJs();

  const ctx = clearCanvas(cvGoutte);
  const map = makeMapper(-2, 1, -2, 1, cvGoutte.width, cvGoutte.height, true);

  // goutte
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alphaGoutte));
  ctx.fillStyle = '#888888';
  const [cx, cy] = map(0, 0), [rx] = map(1, 0);
  ctx.beginPath(); ctx.arc(cx, cy, Math.abs(rx - cx), 0, 2 * Math.PI); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = '#cfe8dd'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, Math.abs(rx - cx), 0, 2 * Math.PI); ctx.stroke();

  const rayColor = wl2rgb(wl);
  rayons.forEach(([x, y]) => drawSeries(ctx, map, x, y, { color: rayColor, width: 1 }));
}

[wls, Ns].forEach(sl => sl.addEventListener('input', () => {
  wlVal.textContent = mapWl(parseFloat(wls.value)).toFixed(0);
  NVal.textContent = Ns.value;
  if (pyodide) render();
}));

async function setup() {
  pyodide = await loadPyodide();
  statusText.textContent = 'Installation de NumPy…';
  await pyodide.loadPackage(['numpy']);
  await loadPhysicalConstants(pyodide);
  await pyodide.runPythonAsync(PYTHON_SETUP);
  statusDot.classList.add('ready');
  statusText.textContent = 'Prêt — moteur Python actif dans le navigateur';
  wlVal.textContent = mapWl(parseFloat(wls.value)).toFixed(0);
  render();
}
setup();
</script>
</body>
</html>
